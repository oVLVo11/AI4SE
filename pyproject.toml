[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pyquality-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "jinja2>=3.1,<4",
  "keyring>=25,<26", "pydantic>=2.9,<3", "python-multipart>=0.0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "hatchling>=1.25,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
pyquality = "pyquality.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/pyquality"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.superpowers",
  "/.worktrees",
  "/tests",
  "/examples",
  "/__pycache__",
  "/.pytest_cache",
  "/.ruff_cache",
  "/dist",
  "/build",
  "**/*.db",
  "**/*.sqlite",
  "**/*.sqlite3",
  "**/*.log",
  "/audit",
  "/cache",
]
